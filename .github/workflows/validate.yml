name: Validate BeastBotSniper

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
        if: github.event_name != 'pull_request' || github.head_ref != 'feat/institutional-full-trading-engine'
      - run: npm run build
