name: Full archive candidate replay (read-only)
on:
  push:
    branches:
      - research/full-candidate-replay-20261125
permissions:
  contents: read
jobs:
  archive-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Replay archived candidate evidence
        run: python3 scripts/archive_candidate_replay.py
      - uses: actions/upload-artifact@v4
        with:
          name: archive-candidate-replay-report
          path: archive-replay-report.json
          retention-days: 14
