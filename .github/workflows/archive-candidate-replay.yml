name: New entry research (read-only)
on:
  push:
    branches:
      - research/full-candidate-replay-20261125
permissions:
  contents: read
jobs:
  archive-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python research code
        run: |
          python3 -m py_compile scripts/archive_candidate_replay.py scripts/new_entry_replay.py scripts/exit_path_replay.py
          python3 scripts/exit_path_replay.py
      - name: Replay archived candidate evidence
        run: python3 scripts/archive_candidate_replay.py
      - uses: actions/upload-artifact@v4
        with:
          name: archive-new-entry-research
          path: archive-replay-report.json
          retention-days: 14
