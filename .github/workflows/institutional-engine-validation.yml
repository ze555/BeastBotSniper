name: Institutional engine validation

on:
  push:
    branches:
      - feat/institutional-full-trading-engine
      - feat/futures-only-violent-wave-engine
      - feat/early-wave-entry-quality-v2
      - research/profitability-redesign
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx src/lib/researchLogger.persistence.test.ts
      - run: npx tsx src/lib/waveRiskEngine.test.ts
      - run: npx tsx src/lib/entryQualityEngine.test.ts
      - run: npx tsx src/lib/institutionalMarketEngine.test.ts
      - run: npx tsx src/lib/marketAlignmentEngine.test.ts
      - run: npx tsx src/lib/reverseWaveEngine.test.ts
      - run: npx tsx src/lib/futuresWaveFeed.test.ts
      - run: npx tsc --noEmit
      - run: npm run build

  official-binance-exit-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/profitability-redesign
      - name: Run 78-trade replay from official Binance Vision archives
        run: |
          python research/historical_data/binance_official_exit_replay.py \
            --trades study_all_trades_master.json \
            --out research-results/official-binance-oct-2026 \
            --fee-rate 0.0004 \
            --slippage-rate 0.0002
      - name: Publish replay report and per-trade audit
        uses: actions/upload-artifact@v4
        with:
          name: beastbot-official-binance-exit-replay-oct-2026
          path: research-results/official-binance-oct-2026/
          if-no-files-found: error
          retention-days: 30
