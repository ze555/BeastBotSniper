name: Research branch validation

on:
  push:
    branches:
      - "research/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests and historical replay
        run: npm test
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
