<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BeastBotSniper | PAQE</title><style>body{font:16px system-ui;background:#101722;color:#e7edf5;margin:24px}main{max-width:1000px;margin:auto}h1{font-size:24px}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}article,pre{background:#1d2939;border:1px solid #334155;border-radius:10px;padding:16px}strong{display:block;font-size:24px;direction:ltr;text-align:right}small{color:#b1c4dc}a{color:#93c5fd}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;text-align:right;border-bottom:1px solid #334155}pre{white-space:pre-wrap;direction:ltr;overflow-wrap:anywhere}#error{color:#fca5a5}</style><main><h1>BeastBotSniper — PAQE</h1><p>تداول ورقي فقط · محرك احتمالي · Binance Futures</p><p id="error"></p><section id="metrics"></section><h2>التعلم والتغذية</h2><pre id="model"></pre><h2>آخر الصفقات المغلقة</h2><table><thead><tr><th>العملة</th><th>الاتجاه</th><th>الصافي $</th><th>الخروج</th></tr></thead><tbody id="trades"></tbody></table><p><a href="/api/paqe">JSON</a> · <a href="/api/legacy/archive">أرشيف النظام السابق</a></p></main><script>const el=id=>document.getElementById(id);const money=x=>Number.isFinite(x)?x.toFixed(2):'—';async function refresh(){try{const r=await fetch('/api/paqe',{cache:'no-store'});if(!r.ok)throw Error(r.status);const s=await r.json();el('error').textContent='';const items=[['الرصيد','$'+money(s.balance)],['حقوق الحساب','$'+money(s.equity)],['صافي المحقق','$'+money(s.realizedPnl)],['مفتوحة',s.open],['مغلقة',s.closed],['نسبة الفوز',s.winRate==null?'—':money(s.winRate*100)+'%'],['معامل الربح',money(s.profitFactor)],['العملات',s.market.symbols],['التغذية',s.market.feedFresh?'متصلة':'غير مؤكدة']];el('metrics').replaceChildren(...items.map(([k,v])=>{const a=document.createElement('article'),b=document.createElement('small'),c=document.createElement('strong');b.textContent=k;c.textContent=v;a.append(b,c);return a}));el('model').textContent=JSON.stringify({model:s.model,counters:s.counters,market:s.market},null,2);el('trades').replaceChildren(...(s.recent||[]).slice().reverse().map(t=>{const tr=document.createElement('tr');for(const v of [t.symbol,t.side,money(t.pnl),t.reason]){const td=document.createElement('td');td.textContent=v;tr.append(td)}return tr}));}catch(e){el('error').textContent='تعذر تحديث البيانات: '+e.message}}refresh();setInterval(refresh,5000);</script></html>
